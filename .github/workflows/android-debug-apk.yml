name: LIFEQUEST Android debug APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build website
        run: pnpm --filter @workspace/lifequest build
      - name: Generate Android project if absent
        working-directory: artifacts/lifequest
        run: |
          if [ ! -f android/gradlew ]; then pnpm exec cap add android; fi
          pnpm exec cap sync android
      - name: Build unsigned-for-release, debug-signed APK
        working-directory: artifacts/lifequest/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFEQUEST-debug-APK
          path: artifacts/lifequest/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
